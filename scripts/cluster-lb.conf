# One address for the backends. A backend that fails is skipped for a few seconds, and the request goes to the other.
# The backends read the address of the browser from X-Forwarded-For, so this proxy appends to it and the backends trust
# the networks of Docker.
upstream backends {
    # A shared zone keeps the rotation and the failure marks the same for all worker processes.
    zone backends 64k;
    server backend-1:8080 max_fails=1 fail_timeout=3s;
    server backend-2:8080 max_fails=1 fail_timeout=3s;
}

server {
    listen 8080;
    server_tokens off;
    location / {
        proxy_pass http://backends;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
    }
}
