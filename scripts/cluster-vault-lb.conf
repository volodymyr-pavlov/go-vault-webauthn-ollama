# One address for the three Vault nodes. A standby node forwards a request to the active node, so any node can answer.
# A node that fails is skipped for a few seconds.
upstream vault {
    zone vault 64k;
    server vault-1:8200 max_fails=1 fail_timeout=3s;
    server vault-2:8200 max_fails=1 fail_timeout=3s;
    server vault-3:8200 max_fails=1 fail_timeout=3s;
}

server {
    listen 8200;
    location / {
        proxy_pass http://vault;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
    }
}
