# The cluster: two backends behind a load balancer, a Vault Raft group of three nodes, MySQL with a replica, and Redis
# with a replica and three Sentinels. LOCAL ONLY, like the stand.
#
#   make cluster-up        builds and starts the cluster. The page is on http://localhost:3100, the API on http://localhost:8180.
#   make cluster-status    shows the leader of Vault, the replication of MySQL and the master of Redis.
#   make cluster-promote   makes mysql-replica the primary and points the backends at it (manual failover).
#   make cluster-down      stops the cluster.
#   make cluster-reset     stops the cluster and wipes all its data.
#
# The cluster uses its own ports (3100, 8180, 8125) and its own volumes, so it can run next to the stand. It pulls the
# model into a volume of its own on the first start.
#
# What is highly available and what is not:
#   backends  two, each with its own -instance number, behind nginx. No state is on them.
#   Vault     three nodes with Raft, behind an nginx address. The cluster-vault job unseals it. After a restart of a node,
#             run `make cluster-up` again to unseal it.
#   Redis     a master, a replica and three Sentinels. The backends follow the master. A failover can lose the nonces
#             and the rate limit counters of the last moments.
#   MySQL     a primary and a replica with GTID replication. The failover is manual (make cluster-promote).
#   Ollama, Mailpit and the page are single containers.

name: go-vault-webauthn-ollama-cluster

x-backend: &backend
  image: go-vault-webauthn-ollama-backend:latest
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    args:
      GO_ALPINE_IMAGE: ${GO_ALPINE_IMAGE}
      ALPINE_IMAGE: ${ALPINE_IMAGE}
  volumes:
    - vault-handoff:/handoff:ro
    - ./scripts/anonymizing-ranges.txt:/etc/login/anonymizing-ranges.txt:ro
  depends_on: &backend-depends
    vault-init:
      condition: service_completed_successfully
    mysql-replication:
      condition: service_completed_successfully
    redis-1:
      condition: service_healthy
    sentinel-1:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    ollama-pull:
      condition: service_completed_successfully
  healthcheck:
    test: ['CMD', 'wget', '-qO-', '--header=User-Agent: healthcheck', 'http://127.0.0.1:8080/healthz']
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 5s

x-vault: &vault
  image: ${VAULT_IMAGE}
  command: ['server']
  cap_add:
    - IPC_LOCK

services:
  vault-1:
    <<: *vault
    environment:
      VAULT_LOCAL_CONFIG: '{"storage":{"raft":{"path":"/vault/file","node_id":"vault-1"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"api_addr":"http://vault-1:8200","cluster_addr":"http://vault-1:8201","disable_mlock":true}'
    volumes:
      - vault-1-data:/vault/file

  vault-2:
    <<: *vault
    environment:
      VAULT_LOCAL_CONFIG: '{"storage":{"raft":{"path":"/vault/file","node_id":"vault-2"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"api_addr":"http://vault-2:8200","cluster_addr":"http://vault-2:8201","disable_mlock":true}'
    volumes:
      - vault-2-data:/vault/file

  vault-3:
    <<: *vault
    environment:
      VAULT_LOCAL_CONFIG: '{"storage":{"raft":{"path":"/vault/file","node_id":"vault-3"}},"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"api_addr":"http://vault-3:8200","cluster_addr":"http://vault-3:8201","disable_mlock":true}'
    volumes:
      - vault-3-data:/vault/file

  # One run that initializes, joins and unseals the three nodes.
  vault-cluster:
    image: ${VAULT_IMAGE}
    entrypoint: ['sh', '/init/cluster-vault.sh']
    volumes:
      - ./scripts/cluster-vault.sh:/init/cluster-vault.sh:ro
      - vault-cluster-keys:/cluster
    depends_on:
      - vault-1
      - vault-2
      - vault-3

  vault-lb:
    image: ${NGINX_IMAGE}
    volumes:
      - ./scripts/cluster-vault-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      vault-cluster:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8200/v1/sys/health?standbyok=true']
      interval: 2s
      timeout: 2s
      retries: 20

  # One run that sets up Transit, the policy and the AppRole through the leader, and hands each backend its own wrapping
  # token.
  vault-init:
    image: ${VAULT_IMAGE}
    entrypoint: ['sh', '/init/vault-init.sh']
    environment:
      VAULT_ADDR: http://vault-lb:8200
      VAULT_TOKEN_FILE: /cluster/root_token
      HANDOFF_COUNT: '2'
    volumes:
      - ./scripts/vault-init.sh:/init/vault-init.sh:ro
      - ./scripts/vault-policy.hcl:/init/vault-policy.hcl:ro
      - vault-handoff:/handoff
      - vault-cluster-keys:/cluster:ro
    depends_on:
      vault-lb:
        condition: service_healthy

  mysql-primary:
    image: ${MYSQL_IMAGE}
    command: ['--server-id=1', '--log-bin=mysql-bin', '--gtid-mode=ON', '--enforce-gtid-consistency=ON']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: login
      MYSQL_USER: login
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-primary-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'login', '-p${MYSQL_PASSWORD}']
      interval: 3s
      timeout: 3s
      retries: 30

  # The replica creates no database and no user of its own. It receives them from the primary through the replication, so
  # the same statements do not run twice.
  mysql-replica:
    image: ${MYSQL_IMAGE}
    command: ['--server-id=2', '--log-bin=mysql-bin', '--relay-log=relay-bin', '--gtid-mode=ON', '--enforce-gtid-consistency=ON', '--log-replica-updates=ON']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-replica-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 3s
      timeout: 3s
      retries: 30

  # One run that starts the replication.
  mysql-replication:
    image: ${MYSQL_IMAGE}
    entrypoint: ['sh', '/init/cluster-mysql.sh']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./scripts/cluster-mysql.sh:/init/cluster-mysql.sh:ro
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  redis-1:
    image: ${REDIS_IMAGE}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  redis-2:
    image: ${REDIS_IMAGE}
    command: ['redis-server', '--replicaof', 'redis-1', '6379']
    depends_on:
      redis-1:
        condition: service_healthy

  sentinel-1: &sentinel
    image: ${REDIS_IMAGE}
    # Sentinel needs a config file that it can write to. It watches the master "main" and needs two of three to agree.
    entrypoint:
      - sh
      - -c
      - |
        printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor main redis-1 6379 2\nsentinel down-after-milliseconds main 3000\nsentinel failover-timeout main 10000\nsentinel parallel-syncs main 1\n' > /tmp/sentinel.conf
        exec redis-server /tmp/sentinel.conf --sentinel
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_started
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '26379', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  sentinel-2:
    <<: *sentinel

  sentinel-3:
    <<: *sentinel

  mailpit:
    image: ${MAILPIT_IMAGE}
    ports:
      - '127.0.0.1:8125:8025/tcp'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 2s
      retries: 15

  backend-1:
    <<: *backend
    command:
      - -http=:8080
      - -metrics=:9090
      - -instance=0
      - -mysql=login:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST:-mysql-primary}:3306)/login
      - -redis-sentinels=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - -redis-master=main
      - -smtp=mailpit:1025
      - -mail-from=login@example.com
      - -vault=http://vault-lb:8200
      - -vault-role-id-file=/handoff/role_id
      - -vault-wrapped-token-file=/handoff/wrapped_token_1
      - -rp-id=localhost
      - -rp-name=Vault Login
      - -origins=${ORIGINS:-http://localhost:3100,http://localhost:8180}
      - -trusted-proxies=${TRUSTED_PROXIES:-172.16.0.0/12}
      - -ollama=http://ollama:11434
      - -ollama-model=${OLLAMA_MODEL}
      - -ollama-digest=${OLLAMA_DIGEST}
      - -anonymizing-ranges=/etc/login/anonymizing-ranges.txt
      - -log-level=${LOG_LEVEL:-info}

  backend-2:
    <<: *backend
    command:
      - -http=:8080
      - -metrics=:9090
      - -instance=1
      - -mysql=login:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST:-mysql-primary}:3306)/login
      - -redis-sentinels=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - -redis-master=main
      - -smtp=mailpit:1025
      - -mail-from=login@example.com
      - -vault=http://vault-lb:8200
      - -vault-role-id-file=/handoff/role_id
      - -vault-wrapped-token-file=/handoff/wrapped_token_2
      - -rp-id=localhost
      - -rp-name=Vault Login
      - -origins=${ORIGINS:-http://localhost:3100,http://localhost:8180}
      - -trusted-proxies=${TRUSTED_PROXIES:-172.16.0.0/12}
      - -ollama=http://ollama:11434
      - -ollama-model=${OLLAMA_MODEL}
      - -ollama-digest=${OLLAMA_DIGEST}
      - -anonymizing-ranges=/etc/login/anonymizing-ranges.txt
      - -log-level=${LOG_LEVEL:-info}

  # One address for the backends and the page.
  lb:
    image: ${NGINX_IMAGE}
    volumes:
      - ./scripts/cluster-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8180:8080/tcp'
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy

  frontend:
    image: go-vault-webauthn-ollama-frontend:latest
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NODE_ALPINE_IMAGE: ${NODE_ALPINE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
        VITE_MAIL_URL: http://127.0.0.1:8125
    environment:
      BACKEND_URL: http://lb:8080
    ports:
      - '127.0.0.1:3100:8080/tcp'
    depends_on:
      lb:
        condition: service_started

  # Ollama has no authentication: it is on the internal network only. Its model volume is the one of the stand.
  ollama:
    image: ${OLLAMA_IMAGE}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - default
      - internal
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ${OLLAMA_IMAGE}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['ollama', 'pull', '${OLLAMA_MODEL}']
    depends_on:
      ollama:
        condition: service_healthy

networks:
  internal:
    internal: true

volumes:
  vault-handoff:
  vault-cluster-keys:
  vault-1-data:
  vault-2-data:
  vault-3-data:
  mysql-primary-data:
  mysql-replica-data:
  ollama-models:
